# Butterfly 主题覆盖配置（根目录此文件优先于 node_modules 内主题默认配置）

# 顶部大图
index_img: /img/cover.jpg        # 首页顶部
default_top_img: /img/cover.jpg  # 其它页面顶部

# 站点图标（浏览器标签页）
favicon: /img/avatar.jpg

# 头像（侧栏/导航栏显示）
avatar:
  img: /img/avatar.jpg

# 侧栏作者卡片（Follow Me 按钮指向自己的 GitHub）
aside:
  card_author:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/Kittenknighta
  card_tags:
    enable: false
  card_announcement:
    enable: true
    content: "<a href=\"/messageboard/\"><b>💬 联系站长 · 点我留言</b></a><br>欢迎来到饼的小窝～"

# 页脚：保留版权行，隐藏“框架 Hexo | 主题 Butterfly”署名
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: false

# 导航栏菜单（去掉标签；归档改名按时间归档；加联系站长）
menu:
  首页: / || fas fa-home
  按时间归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder
  联系站长: /messageboard/ || fas fa-comment-dots

# 评论系统：giscus（基于 GitHub Discussions，访客用 GitHub 账号留言）
comments:
  use: Giscus

giscus:
  repo: Kittenknighta/Kittenknighta.github.io
  repo_id: R_kgDOUik5Tw
  category_id: DIC_kwDOUik5T84DGFOm
